name: RoleRadar Auto-Scraper

on:
  schedule:
    - cron: "0 2 * * *" # 8:00 AM BST (Morning Scrape)
    - cron: "0 8 * * *" # 2:00 PM BST (Afternoon Scrape)
    - cron: "0 15 * * *" # 9:00 PM BST (Evening Scrape + Daily Digest)
  workflow_dispatch:

jobs:
  scrape-and-digest:
    name: Run Scraper & Digest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./scraper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install Patchright Chromium browser and system dependencies
        run: npx patchright install --with-deps chromium

      - name: Run Extraction Engine
        run: npm start
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          SYNC_API_URL: ${{ secrets.SYNC_API_URL }}

      - name: Trigger Daily Email Digest
        if: always() && (github.event.schedule == '0 15 * * *' || github.event_name == 'workflow_dispatch')
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -i -f -X GET https://roleradar-dev.vercel.app/api/jobs/daily-digest \
            -H "Authorization: Bearer $CRON_SECRET"
