name: RoleRadar Auto-Scraper

on:
  schedule:
    # 3 daily scraper runs: 8:00 AM, 12:00 PM, and 8:00 PM BST (UTC+6) -> 02:00, 06:00, 14:00 UTC
    - cron: '0 2,6,14 * * *'
    # Daily email digest run: 9:00 PM BST (UTC+6) -> 15:00 UTC
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  scrape:
    name: Run Scraper
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != '0 15 * * *'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./scraper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install Patchright Chromium browser and system dependencies
        run: npx patchright install --with-deps chromium

      - name: Run Extraction Engine
        run: npm start
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          SYNC_API_URL: ${{ secrets.SYNC_API_URL }}

  daily-digest:
    name: Trigger Daily Digest
    if: |
      always() &&
      (github.event.schedule == '0 15 * * *' ||
       (github.event_name == 'workflow_dispatch' && needs.scrape.result == 'success'))
    needs: [scrape]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily Email Digest
        run: |
          curl -X GET https://roleradar-dev.vercel.app/api/jobs/daily-digest \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
