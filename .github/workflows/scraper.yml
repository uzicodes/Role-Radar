name: RoleRadar Auto-Scraper

on:
  schedule:
    # Runs 3 times a day (UTC+6 Bangladesh Standard Time):
    # 02:00 UTC -> 08:00 AM BST (Morning scrape)
    # 08:00 UTC -> 02:00 PM BST (Afternoon scrape)
    # 15:00 UTC -> 09:00 PM BST (Evening scrape + Consolidated Daily Email Digest)
    - cron: '0 2,8,15 * * *'
  workflow_dispatch:

jobs:
  scrape-and-digest:
    name: Run Scraper & Digest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./scraper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install Patchright Chromium browser and system dependencies
        run: npx patchright install --with-deps chromium

      - name: Run Extraction Engine
        run: npm start
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          SYNC_API_URL: ${{ secrets.SYNC_API_URL }}

      - name: Trigger Daily Email Digest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          CURRENT_HOUR=$(date -u +%H)
          echo "Current UTC hour: $CURRENT_HOUR"
          if [ "$CURRENT_HOUR" = "15" ] || [ "$CURRENT_HOUR" = "16" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "🚀 Triggering 9:00 PM BST Daily Digest..."
            curl -i -X GET https://roleradar-dev.vercel.app/api/jobs/daily-digest \
              -H "Authorization: Bearer $CRON_SECRET"
          else
            echo "ℹ️ Skipping email digest for intermediate scrape run (current UTC hour is $CURRENT_HOUR, digest triggers at 15:00 UTC / 9:00 PM BST)."
          fi
