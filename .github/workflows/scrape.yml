name: RoleRadar Auto-Scraper

on:
  schedule:
    # Runs at 8 AM, 12 PM, and 8 PM Bangladesh Standard Time (UTC+6)
    - cron: '0 2,6,14 * * *'
  workflow_dispatch:

jobs:
  scrape:
    name: Run Scraper
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./scraper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install Patchright Chromium browser and system dependencies
        run: npx patchright install --with-deps chromium

      - name: Run Extraction Engine
        run: npm start
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          SYNC_API_URL: ${{ secrets.SYNC_API_URL }}

