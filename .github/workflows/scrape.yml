name: RoleRadar Auto-Scraper

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  # Allow manual trigger from the Actions tab in GitHub
  workflow_dispatch:

jobs:
  scrape:
    name: Run Scraper
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./scraper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install Patchright Chromium browser and system dependencies
        run: npx patchright install --with-deps chromium

      - name: Run scraper
        run: npm start
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          SYNC_API_URL: ${{ secrets.SYNC_API_URL }}

